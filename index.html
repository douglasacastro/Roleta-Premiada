<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Premiado — Roleta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F6EFD8;
    --gold:#C9A227;
    --gold-light:#E8CE72;
    --brown:#3B2A1E;
    --green:#B8CB2E;
    --green-dark:#7D9B1E;
    --orange:#E8722C;
    --charcoal:#241B12;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 50% 0%, #fffbe8 0%, var(--cream) 45%, #ecdfae 100%);
    font-family:'Poppins',sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:28px 16px 60px;
    color:var(--brown);
    overflow-x:hidden;
  }

  .eyebrow{
    font-family:'Poppins',sans-serif;
    font-weight:700;
    letter-spacing:.35em;
    font-size:11px;
    text-transform:uppercase;
    color:var(--green-dark);
    margin-bottom:6px;
  }

  h1{
    font-family:'Anton',sans-serif;
    font-weight:400;
    font-size:clamp(34px,8vw,58px);
    letter-spacing:.02em;
    margin:0 0 2px;
    color:var(--brown);
    text-align:center;
    line-height:.95;
    text-shadow: 2px 2px 0 var(--gold-light);
  }
  h1 span{color:var(--orange);}

  .subtitle{
    font-size:14px;
    font-weight:500;
    color:#6b5a3f;
    margin-bottom:28px;
    text-align:center;
    max-width:420px;
  }

  .wheel-wrap{
    position:relative;
    width:min(92vw,460px);
    aspect-ratio:1/1;
    margin-top:8px;
  }

  .pointer{
    position:absolute;
    top:-6px;
    left:50%;
    transform:translateX(-50%);
    width:54px;
    height:64px;
    z-index:5;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.35));
  }

  .ring{
    position:absolute;
    inset:0;
    border-radius:50%;
    background:conic-gradient(var(--gold-light),var(--gold),var(--brown),var(--gold),var(--gold-light));
    padding:10px;
    box-shadow:
      0 18px 40px rgba(59,42,30,.35),
      inset 0 0 0 2px rgba(255,255,255,.25);
  }

  #wheelCanvas{
    width:100%;
    height:100%;
    border-radius:50%;
    display:block;
    transition: transform 5.2s cubic-bezier(.12,.72,.13,1);
    box-shadow: inset 0 0 0 6px rgba(36,27,18,.15);
  }

  .hub{
    position:absolute;
    top:50%;left:50%;
    width:33%;
    height:33%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:var(--cream);
    box-shadow:
      0 0 0 6px var(--gold),
      0 0 0 9px var(--brown),
      0 8px 18px rgba(0,0,0,.35);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    z-index:4;
  }
  .hub img{
    width:100%;
    height:100%;
    object-fit:cover;
    transform:scale(1.04);
  }

  .spin-btn{
    position:relative;
    flex-shrink:0;
    width:132px;
    height:132px;
    border-radius:50%;
    border:none;
    cursor:pointer;
    background:
      radial-gradient(circle at 35% 30%, #e4f27a, var(--green) 55%, var(--green-dark) 100%);
    box-shadow:
      0 12px 0 #5c7314,
      0 18px 26px rgba(0,0,0,.35),
      inset 0 0 0 3px rgba(255,255,255,.35);
    font-family:'Anton',sans-serif;
    font-size:22px;
    letter-spacing:.05em;
    color:var(--charcoal);
    text-shadow:0 1px 0 rgba(255,255,255,.4);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .spin-btn:before, .spin-btn:after{
    content:"";
    position:absolute;
    top:8%;
    left:50%;
    width:2px;
    height:84%;
    background:rgba(232,114,44,.55);
    border-radius:50%;
  }
  .spin-btn:before{transform:translateX(-50%) rotate(38deg) scaleX(6);}
  .spin-btn:after{transform:translateX(-50%) rotate(-38deg) scaleX(6);}
  .spin-btn:active{
    transform:translateY(8px);
    box-shadow:
      0 4px 0 #5c7314,
      0 8px 14px rgba(0,0,0,.3),
      inset 0 0 0 3px rgba(255,255,255,.35);
  }
  .spin-btn:disabled{
    filter:grayscale(.4) brightness(.9);
    cursor:not-allowed;
  }

  .spin-section{
    display:flex;
    justify-content:center;
    margin-top:34px;
  }

  .partners-title{
    margin-top:36px;
    font-size:11px;
    font-weight:700;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--green-dark);
    text-align:center;
  }

  .partners-row{
    display:flex;
    flex-wrap:wrap;
    align-items:stretch;
    justify-content:center;
    gap:14px;
    margin-top:14px;
    width:100%;
    max-width:560px;
  }

  .partner-box{
    flex:0 1 auto;
    width:104px;
    height:84px;
    background:var(--cream);
    border:2px solid var(--gold);
    border-radius:14px;
    box-shadow:0 8px 18px rgba(59,42,30,.18), inset 0 0 0 1px rgba(255,255,255,.5);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:8px 10px;
  }

  .partner-logo{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
  }

  .partner-placeholder{
    font-size:10.5px;
    font-weight:600;
    color:#b3a172;
    text-align:center;
    line-height:1.3;
  }

  .footnote{
    margin-top:22px;
    font-size:11.5px;
    color:#8a7752;
    text-align:center;
    max-width:380px;
    line-height:1.5;
  }

  /* Result modal */
  .overlay{
    position:fixed;inset:0;
    background:rgba(36,27,18,.6);
    display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;
    transition:opacity .3s ease;
    z-index:20;
    padding:20px;
  }
  .overlay.show{opacity:1;pointer-events:auto;}
  .modal{
    background:var(--cream);
    border-radius:22px;
    padding:36px 28px 28px;
    max-width:320px;
    width:100%;
    text-align:center;
    box-shadow:0 24px 60px rgba(0,0,0,.4);
    border:4px solid var(--gold);
    transform:scale(.85);
    transition:transform .35s cubic-bezier(.2,1.4,.4,1);
  }
  .overlay.show .modal{transform:scale(1);}
  .modal .tag{
    font-size:12px;
    font-weight:700;
    letter-spacing:.3em;
    text-transform:uppercase;
    color:var(--orange);
    margin-bottom:8px;
  }
  .modal h2{
    font-family:'Anton',sans-serif;
    font-size:clamp(20px,6vw,30px);
    line-height:1.15;
    margin:0 0 14px;
    color:var(--brown);
  }
  .modal p{
    font-size:13.5px;
    color:#6b5a3f;
    margin-bottom:22px;
    line-height:1.5;
  }
  .modal button{
    background:var(--brown);
    color:var(--cream);
    border:none;
    padding:12px 28px;
    border-radius:999px;
    font-family:'Poppins',sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    letter-spacing:.03em;
  }
  .modal button:hover{background:#4d3826;}

  @media (prefers-reduced-motion: reduce){
    #wheelCanvas{transition:none;}
  }
</style>
</head>

<script>
const prizes = [
  { label:"Grip",         color:"#C9A227" },
  { label:"Hambúrguer",   color:"#3B2A1E" },
  { label:"Camisa",       color:"#B8CB2E" },
  { label:"Vale FLOWTY",  color:"#C9A227" },
  { label:"Boné",         color:"#3B2A1E" },
  { label:"Vale Belvedere Beef", color:"#B8CB2E" },
  { label:"Chaveiro",     color:"#C9A227" },
  { label:"Depilare (Depilação laser axila)", color:"#3B2A1E" },
  { label:"Vale compra TUDÃO $50", color:"#B8CB2E" },
  { label:"Garrafa térmica", color:"#C9A227" },
  { label:"Kit Garrafa térmica", color:"#3B2A1E" },
  { label:"Copos Stanley", color:"#B8CB2E" },
  { label:"01 hora de quadra", color:"#C9A227" },
];

const canvas = document.getElementById('wheelCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const cx = W/2, cy = H/2, radius = W/2 - 6;
const n = prizes.length;
const arc = (Math.PI*2)/n;

function textColorFor(bg){
  return (bg === "#B8CB2E" || bg === "#C9A227") ? "#241B12" : "#F6EFD8";
}

function wrapToLines(label, k){
  const words = label.split(' ');
  if(k === 1) return [label];
  if(words.length < k) return null;
  const target = label.length / k;
  let lines = [];
  let current = '';
  for(let i = 0; i < words.length; i++){
    if(lines.length === k - 1){
      current = current ? current + ' ' + words.slice(i).join(' ') : words.slice(i).join(' ');
      break;
    }
    const w = words[i];
    const test = current ? current + ' ' + w : w;
    if(current && test.length > target){
      lines.push(current);
      current = w;
    } else {
      current = test;
    }
  }
  lines.push(current);
  return lines.length === k ? lines : null;
}

// Finds the largest font size (and best line split) that actually fits
// within the wedge shape: text must not exceed the available radial
// width, and the stacked lines must not exceed the wedge's tangential
// (angular) width at the innermost point the text reaches.
function fitLabel(ctx, label, arcRad, outerX, innerLimitX){
  const availWidth = outerX - innerLimitX;
  const maxSizes = [30, 28, 26, 24, 22, 20, 18, 16, 15];
  for(const fontSize of maxSizes){
    ctx.font = `800 ${fontSize}px Poppins, sans-serif`;
    for(let k = 1; k <= 3; k++){
      const candidate = wrapToLines(label, k);
      if(!candidate) continue;
      const widths = candidate.map(l => ctx.measureText(l).width);
      const maxW = Math.max(...widths);
      const lineGap = fontSize * (k > 2 ? 0.9 : 1.0);
      const totalH = candidate.length * lineGap;
      const maxTangential = innerLimitX * arcRad * 0.82;
      if(maxW <= availWidth * 0.92 && totalH <= maxTangential){
        return { lines: candidate, fontSize, lineGap };
      }
    }
  }
  // fallback: smallest font, 3 lines, whatever fits
  const fontSize = 14;
  ctx.font = `800 ${fontSize}px Poppins, sans-serif`;
  return { lines: wrapToLines(label, 3) || [label], fontSize, lineGap: fontSize * 0.9 };
}

function drawWheel(){
  ctx.clearRect(0,0,W,H);
  for(let i=0;i<n;i++){
    const start = i*arc - Math.PI/2;
    const end = start + arc;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,radius,start,end);
    ctx.closePath();
    ctx.fillStyle = prizes[i].color;
    ctx.fill();
    ctx.strokeStyle = "rgba(246,239,216,.55)";
    ctx.lineWidth = 3;
    ctx.stroke();

    // label
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(start + arc/2);
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    ctx.fillStyle = textColorFor(prizes[i].color);

    const outerX = radius - 34;
    const innerLimitX = radius * 0.46; // keep clear of the hub + its shadow rings
    const fit = fitLabel(ctx, prizes[i].label, arc, outerX, innerLimitX);
    ctx.font = `800 ${fit.fontSize}px Poppins, sans-serif`;
    fit.lines.forEach((line, idx) => {
      const yOff = (idx - (fit.lines.length - 1) / 2) * fit.lineGap;
      ctx.fillText(line, outerX, yOff);
    });
    ctx.restore();
  }
}
drawWheel();

let currentRotation = 0;
let spinning = false;
const spinBtn = document.getElementById('spinBtn');
const overlay = document.getElementById('overlay');
const prizeNameEl = document.getElementById('prizeName');

function spin(){
  if(spinning) return;
  spinning = true;
  spinBtn.disabled = true;

  const winnerIndex = Math.floor(Math.random()*n);
  // angle (in degrees) of the middle of the winning segment, measured from top (12 o'clock), clockwise
  const segMidDeg = (winnerIndex*arc + arc/2) * (180/Math.PI);
  // random jitter within the segment so it doesn't always land dead-center
  const jitter = (Math.random()-0.5) * ( (arc*(180/Math.PI)) * 0.6 );
  const extraSpins = 6; // full rotations for effect
  // We need final rotation such that the pointer (fixed at top) lands on winner segment center.
  // Canvas draws segment i starting at -90deg + i*arc. Wheel rotates via CSS transform (clockwise positive).
  // Target rotation so that segment mid ends up at top (0deg / 360deg mark).
  const targetMod = (360 - segMidDeg - jitter + 360) % 360;
  const finalRotation = currentRotation - (currentRotation % 360) + extraSpins*360 + targetMod;

  currentRotation = finalRotation;
  canvas.style.transform = `rotate(${currentRotation}deg)`;

  setTimeout(()=>{
    spinning = false;
    spinBtn.disabled = false;
    prizeNameEl.textContent = prizes[winnerIndex].label;
    overlay.classList.add('show');
  }, 5300);
}

spinBtn.addEventListener('click', spin);
document.getElementById('closeModal').addEventListener('click', ()=>{
  overlay.classList.remove('show');
});
</script>
</body>
</html>
